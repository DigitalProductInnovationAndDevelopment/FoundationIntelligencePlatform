[mypy]
python_version = 3.12
explicit_package_bases = True
ignore_missing_imports = True
check_untyped_defs = True
show_error_codes = True
warn_unused_configs = True

files =
    scripts/validate_terraform_static.py,
    scripts/verify_transition.py,
    scripts/verify_local_rollback.py,
    src/bff/config.py,
    src/bff/database.py,
    src/bff/main.py,
    src/bff/auth.py,
    src/bff/security.py,
    src/bff/user_management.py,
    src/bff/postgres/admin_routes.py,
    src/bff/postgres/dependencies.py,
    src/bff/postgres/governance_repository.py,
    src/bff/postgres/governance_routes.py,
    src/bff/postgres/idempotency_repository.py,
    src/bff/postgres/job_repository.py,
    src/bff/postgres/pipeline_repository.py,
    src/bff/postgres/routes.py,
    src/bff/postgres/scraper_routes.py,
    src/governance/exposure.py,
    src/governance/retention.py,
    src/migration/aws_entrypoint.py,
    src/migration/database_access.py,
    src/migration/sqlite_to_postgres.py,
    src/observability/metrics.py,
    src/transition/runtime.py,
    src/transition/shadow.py,
    src/pipelines/durable.py,
    src/pipelines/durable_worker.py
