[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
timezone = UTC

# The runtime URL is assembled from DATABASE_URL or DATABASE_* plus the mounted
# password file by alembic/env.py. No credential belongs in this file.
sqlalchemy.url = postgresql+asyncpg://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
